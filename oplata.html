	<div class="container" style="margin-top: 70px;">
		<form class="forma_vopr" id="payment-form">
			<div class="row">
				<div class="col" style="display: flex;">
					<div class="col1">
						<h3 class="h3_boot" style="width: 670px;">
							Контактные данные
						</h3>
						<div class="col1" style="width: 670px;">
								<fieldset class="col1_1">
									<label class="label">
										ФИО:
									</label>
									<input type="text" class="input1" name="fio">
									<label class="label">
										Телефон:
									</label>
									<input type="tel" class="input1" name="phone">
								</fieldset>
								<fieldset>
									<label class="label">
										Адрес доставки:
									</label>
									<input type="text" class="input1" name="address">
									<label class="label">
										Почта:
									</label>
									<input type="text" class="input1" name="email">
								</fieldset>
						</div>
					</div>
					<div class="col2" style="max-width: 670px;">
						<h3 class="h3_boot" style="width: 670px;">
							Данные банковской карты
						</h3>
						<div class="all_karta">
							<div class="karta">
								<label class="label2">
									Номер карты
								</label>
								<input type="text" class="inp_karta_1" name="card_number">
								<label class="label2" style="	margin-top: 6px;">
									Действует до
								</label>
								<input type="text" class="inp_karta_2" name="expiry">
							</div>
							<div class="karta2">
								<div class="poloska">
								</div>
								<label class="label3">
									CVV/CVC
								</label>
								<input type="text" class="inp_karta_3" name="cvv">

									С обратной <br> стороны
								</p>
							</div>
						</div>
					</div>
				</div>
			</div>
			</form>
		</div>
		<div class="container" style="margin-top: 50px;">
			<div class="row">
				<div class="col">

				</div>
			</div>
		</div>
		<dialog class="oplata" id="modal">
			<button class="close" id="cancelbtn">X</button>
			<div class="con_opl">
				<h1 class="h1_opl">
					Заказ успешно оплачен!

				<div class="sotial">

					<a href="">

		<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    emailjs.init("yayO1v6lsFVU-NChW");
  const form = document.getElementById('payment-form');
  const modal = document.getElementById('modal');
  const cancelBtn = document.getElementById('cancelbtn');
  form.addEventListener('submit', function(event) {
    event.preventDefault(); 
    emailjs.sendForm('service_cv0zt8k', 'template_46nt10e', this)
      .then(() => {
        modal.showModal(); 
        this.reset(); 
      }, (error) => {
        alert('Ошибка отправки: ' + JSON.stringify(error));
      });
  });
  cancelBtn.addEventListener('click', () => {
    modal.close();
  });
</script>
	<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
